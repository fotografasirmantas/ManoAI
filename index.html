<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1f22">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Mano AI</title>
<style>
:root{--bg:#f6f6f7;--card:#fff;--txt:#1b1b1f;--mut:#6b6b75;--acc:#4f6bed;--user:#4f6bed;--usertxt:#fff;--err:#c0392b}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#1e1f22;--card:#2b2d31;--txt:#ececf1;--mut:#9a9aa5;--acc:#7b8cff;--user:#4f6bed;--usertxt:#fff;--err:#ff6b6b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;display:flex;flex-direction:column;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;gap:8px;padding:10px;background:var(--card)}
header select{flex:1;padding:10px;border-radius:10px;border:1px solid var(--mut);background:var(--bg);color:var(--txt);font-size:15px}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#fff;font-size:16px}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;line-height:1.45;word-wrap:break-word}
.user{align-self:flex-end;background:var(--user);color:var(--usertxt)}
.assistant{align-self:flex-start;background:var(--card)}
.err{color:var(--err)}
footer{display:flex;gap:8px;padding:10px;background:var(--card)}
textarea{flex:1;resize:none;padding:10px;border-radius:10px;border:1px solid var(--mut);background:var(--bg);color:var(--txt);font-size:16px;font-family:inherit}
dialog{border:0;border-radius:14px;background:var(--card);color:var(--txt);width:min(92vw,420px)}
dialog label{display:block;margin:10px 0;font-size:14px;color:var(--mut)}
dialog input,dialog textarea{width:100%;margin-top:4px;padding:9px;border-radius:8px;border:1px solid var(--mut);background:var(--bg);color:var(--txt);font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row button.sec{background:var(--mut)}
</style>
</head>
<body>
<header>
  <select id="model"></select>
  <button id="setBtn" aria-label="Nustatymai">⚙️</button>
</header>
<main id="chat"></main>
<footer>
  <textarea id="input" rows="1" placeholder="Rašyk žinutę…"></textarea>
  <button id="send">➤</button>
</footer>

<dialog id="settings">
  <h3>Nustatymai</h3>
  <label>API adresas (iš anymodel.org dokumentacijos)
    <input id="baseUrl" placeholder="https://…/v1"></label>
  <label>API raktas
    <input id="apiKey" type="password" autocomplete="off"></label>
  <label>Modeliai (po vieną eilutėje)
    <textarea id="models" rows="5"></textarea></label>
  <div class="row">
    <button id="save">Išsaugoti</button>
    <button id="fetchModels" class="sec">Gauti modelius</button>
    <button id="clear" class="sec">Išvalyti pokalbį</button>
    <button id="close" class="sec">Uždaryti</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const S = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
};
const DEFAULT_MODELS = "claude-opus-5-5\nclaude-sonnet-5-5\nclaude-haiku-5-5";
let history = [];
try { history = JSON.parse(S.get('history') || '[]'); } catch { history = []; }

function fillModels() {
  const list = (S.get('models') || DEFAULT_MODELS).split('\n').map(s => s.trim()).filter(Boolean);
  $('model').innerHTML = list.map(m => `<option>${m}</option>`).join('');
  const last = S.get('lastModel');
  if (last && list.includes(last)) $('model').value = last;
}
function openSettings() {
  $('baseUrl').value = S.get('baseUrl') || '';
  $('apiKey').value = S.get('apiKey') || '';
  $('models').value = S.get('models') || DEFAULT_MODELS;
  $('settings').showModal();
}
function add(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  $('chat').appendChild(d);
  $('chat').scrollTop = $('chat').scrollHeight;
  return d;
}
function base() { return (S.get('baseUrl') || '').replace(/\/+$/, ''); }

async function send() {
  const text = $('input').value.trim();
  if (!text) return;
  if (!base() || !S.get('apiKey')) { openSettings(); return; }
  $('input').value = '';
  history.push({ role: 'user', content: text });
  add('user', text);
  const el = add('assistant', '…');
  $('send').disabled = true;
  try {
    const r = await fetch(base() + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + S.get('apiKey') },
      body: JSON.stringify({ model: $('model').value, messages: history })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error?.message || ('HTTP ' + r.status));
    const ans = d.choices?.[0]?.message?.content ?? '(tuščias atsakymas)';
    history.push({ role: 'assistant', content: ans });
    el.textContent = ans;
    S.set('history', JSON.stringify(history));
  } catch (e) {
    history.pop();
    el.textContent = 'Klaida: ' + e.message;
    el.classList.add('err');
  }
  $('send').disabled = false;
}

$('send').onclick = send;
$('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('setBtn').onclick = openSettings;
$('close').onclick = () => $('settings').close();
$('model').onchange = () => S.set('lastModel', $('model').value);
$('save').onclick = () => {
  S.set('baseUrl', $('baseUrl').value.trim());
  S.set('apiKey', $('apiKey').value.trim());
  S.set('models', $('models').value.trim());
  fillModels();
  $('settings').close();
};
$('fetchModels').onclick = async () => {
  try {
    const url = $('baseUrl').value.trim().replace(/\/+$/, '');
    const r = await fetch(url + '/models', { headers: { 'Authorization': 'Bearer ' + $('apiKey').value.trim() } });
    const d = await r.json();
    $('models').value = (d.data || []).map(m => m.id).join('\n');
  } catch (e) { alert('Nepavyko gauti modelių: ' + e.message); }
};
$('clear').onclick = () => { history = []; S.set('history', '[]'); $('chat').innerHTML = ''; $('settings').close(); };

fillModels();
history.forEach(m => add(m.role, m.content));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
