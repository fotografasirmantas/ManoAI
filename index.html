<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https://anymodel.org; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="style.css">
<title>Mano AI</title>
</head>
<body>

<header class="top">
  <button id="bMenu" class="ib" aria-label="Meniu"></button>
  <button id="bModel" class="model" aria-label="Pasirinkti modelį"><span id="modelName"></span></button>
  <button id="bTemp" class="ib" aria-label="Laikinas pokalbis"></button>
  <button id="bNew" class="ib" aria-label="Naujas pokalbis"></button>
</header>
<div id="tempBar" class="tempbar" hidden></div>

<main id="msgs" class="msgs"></main>

<footer class="composer">
  <div id="pending" class="pending"></div>
  <div class="box">
    <textarea id="input" rows="1" placeholder="Klauskite bet ko"></textarea>
    <div class="bar">
      <button id="bPlus" class="ib" aria-label="Pridėti"></button>
      <div class="sp"></div>
      <button id="bMic" class="ib" aria-label="Mikrofonas"></button>
      <button id="bGo" class="go" aria-label="Siųsti"></button>
    </div>
  </div>
</footer>

<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fImg" accept="image/*" multiple hidden>
<input type="file" id="fAny" multiple hidden>
<input type="file" id="fImport" accept=".txt,.ics,.csv" hidden>

<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer"></aside>
<div id="sheet" class="sheet" hidden></div>

<section id="page" class="page" hidden>
  <header class="phead"><button id="pBack" class="ib" aria-label="Atgal"></button><h2 id="pTitle"></h2></header>
  <div id="pBody" class="pbody"></div>
</section>

<div id="live" class="live" hidden>
  <video id="liveVideo" playsinline muted hidden></video>
  <div id="orb" class="orb"></div>
  <p id="liveStatus" class="livestatus"></p>
  <p id="liveText" class="livetext"></p>
  <div class="livebar">
    <button id="lCam" class="lb" aria-label="Kamera"></button>
    <button id="lEnd" class="lb end" aria-label="Baigti"></button>
  </div>
</div>

<div id="lock" class="lock">
  <div class="lockbox">
    <div id="lockLogo" class="logo"></div>
    <h1 id="lockTitle">Mano AI</h1>
    <p id="lockHint"></p>
    <input id="lockPass" class="in" type="password" autocomplete="current-password" placeholder="Slaptažodis">
    <input id="lockPass2" class="in" type="password" autocomplete="new-password" placeholder="Pakartokite slaptažodį" hidden>
    <button id="lockBtn" class="btn p w">Atrakinti</button>
    <p id="lockErr" class="err"></p>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="app.js"></script><script src="app2.js"></script>
</body>
</html>
