<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14131a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Mano AI</title>
<style>
:root{--bg:#f4f1fb;--surface:#fff;--surface2:#ece8f6;--txt:#1d1b26;--mut:#7a7590;--line:#e2dcf0;--err:#d6455d;
 --grad:linear-gradient(135deg,#7c5cff,#ff6fa5)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14131a;--surface:#1f1d28;--surface2:#2a2735;--txt:#eeeaf8;--mut:#9c97b0;--line:#2f2c3b;--err:#ff7a90}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:10px;padding:12px 14px}
.logo{width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:20px;flex:none;box-shadow:0 4px 14px rgba(124,92,255,.35)}
.titles{flex:1;min-width:0}
.titles b{display:block;font-size:17px;line-height:1.2}
.pick{position:relative;display:inline-block;max-width:100%}
.pick select{appearance:none;-webkit-appearance:none;border:0;background:var(--surface2);color:var(--mut);font:inherit;font-size:13px;padding:3px 26px 3px 10px;border-radius:99px;max-width:100%}
.pick::after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:12px;pointer-events:none}
.icon{width:42px;height:42px;border-radius:13px;border:0;background:var(--surface);color:var(--txt);font-size:19px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
#chat{flex:1;overflow-y:auto;padding:8px 14px 16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:flex-end;animation:pop .25s ease}
.row.user{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:50%;background:var(--grad);flex:none;display:grid;place-items:center;font-size:15px;color:#fff}
.bubble{max-width:82%;padding:11px 15px;border-radius:20px;overflow-wrap:anywhere}
.user .bubble{background:var(--grad);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.assistant .bubble{background:var(--surface);border-bottom-left-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.bubble p{margin:0 0 .6em}.bubble p:last-child{margin:0}
.bubble pre{background:var(--surface2);padding:10px;border-radius:10px;overflow-x:auto;font-size:13px;margin:.4em 0}
.bubble code{font-family:ui-monospace,Menlo,monospace;font-size:.9em}
.err .bubble{color:var(--err)}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:b 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#empty{margin:auto;text-align:center;padding:20px;max-width:340px;width:100%}
#empty .logo{width:76px;height:76px;border-radius:26px;margin:0 auto 16px;font-size:38px}
#empty h2{margin:0 0 6px;font-size:23px}
#empty p{color:var(--mut);margin:0 0 20px}
.sugg{display:flex;flex-direction:column;gap:8px}
.sugg button{border:1px solid var(--line);background:var(--surface);color:var(--txt);padding:13px 15px;border-radius:16px;text-align:left;font:inherit;font-size:15px}
footer{padding:8px 12px 12px}
.composer{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border-radius:28px;padding:6px 6px 6px 18px;box-shadow:0 2px 14px rgba(0,0,0,.08);border:1px solid var(--line)}
#input{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--txt);font:inherit;padding:9px 0;max-height:140px}
#send{width:44px;height:44px;border-radius:50%;border:0;background:var(--grad);color:#fff;font-size:18px;flex:none}
#send:disabled{opacity:.4}
dialog{border:0;padding:22px;background:var(--surface);color:var(--txt);width:100%;max-width:520px;margin:auto auto 0;border-radius:26px 26px 0 0;
 padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
dialog::backdrop{background:rgba(10,8,20,.45);backdrop-filter:blur(3px)}
dialog h3{margin:0 0 4px;font-size:20px}
.field{display:block;margin:12px 0;font-size:13px;color:var(--mut)}
.field input,.field textarea{display:block;width:100%;margin-top:5px;padding:11px 13px;border-radius:13px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font:inherit;font-size:15px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btns button{border:0;border-radius:14px;padding:13px;font:inherit;font-size:15px;background:var(--surface2);color:var(--txt)}
.btns .primary{background:var(--grad);color:#fff;grid-column:1/-1;font-weight:600}
</style>
</head>
<body>
<header>
  <div class="logo">✨</div>
  <div class="titles">
    <b>Mano AI</b>
    <label class="pick"><select id="model" aria-label="Modelis"></select></label>
  </div>
  <button class="icon" id="setBtn" aria-label="Nustatymai">⚙️</button>
</header>

<main id="chat"></main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Paklausk ko nori…"></textarea>
    <button id="send" aria-label="Siųsti">➤</button>
  </div>
</footer>

<dialog id="settings">
  <h3>Nustatymai</h3>
  <label class="field">API adresas
    <input id="baseUrl" placeholder="https://…/v1"></label>
  <label class="field">API raktas
    <input id="apiKey" type="password" autocomplete="off"></label>
  <label class="field">Modeliai (po vieną eilutėje)
    <textarea id="models" rows="4"></textarea></label>
  <div class="btns">
    <button id="save" class="primary">Išsaugoti</button>
    <button id="fetchModels">Gauti modelius</button>
    <button id="clear">Naujas pokalbis</button>
    <button id="close" style="grid-column:1/-1">Uždaryti</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const S = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
};
const DEFAULT_MODELS = "claude-opus-5-5\nclaude-sonnet-5-5\nclaude-haiku-5-5";
const SUGG = ["Padėk sugalvoti nuotraukos aprašymą Instagramui", "Kokios geriausios fotografavimo vietos Lietuvoje?", "Paaiškink paprastai, kas yra diafragma"];
let history = [];
try { history = JSON.parse(S.get('history') || '[]'); } catch { history = []; }

function md(t) {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return String(t).split('```').map((p, i) => {
    if (i % 2) return '<pre><code>' + esc(p.replace(/^[^\n]*\n/, '')) + '</code></pre>';
    return esc(p).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .split(/\n{2,}/).map(x => x.trim() ? '<p>' + x.trim().replace(/\n/g, '<br>') + '</p>' : '').join('');
  }).join('');
}
function fillModels() {
  const list = (S.get('models') || DEFAULT_MODELS).split('\n').map(s => s.trim()).filter(Boolean);
  $('model').innerHTML = '';
  list.forEach(m => { const o = document.createElement('option'); o.textContent = m; $('model').appendChild(o); });
  const last = S.get('lastModel');
  if (last && list.includes(last)) $('model').value = last;
}
function openSettings() {
  $('baseUrl').value = S.get('baseUrl') || '';
  $('apiKey').value = S.get('apiKey') || '';
  $('models').value = S.get('models') || DEFAULT_MODELS;
  $('settings').showModal();
}
function add(role, text) {
  $('empty')?.remove();
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const b = document.createElement('div');
  b.className = 'bubble';
  if (role === 'user') b.textContent = text;
  else { const av = document.createElement('div'); av.className = 'av'; av.textContent = '✨'; row.appendChild(av); b.innerHTML = md(text); }
  row.appendChild(b);
  $('chat').appendChild(row);
  $('chat').scrollTop = $('chat').scrollHeight;
  return b;
}
function render() {
  $('chat').innerHTML = '';
  if (!history.length) {
    const e = document.createElement('div');
    e.id = 'empty';
    e.innerHTML = '<div class="logo">✨</div><h2>Labas! 👋</h2><p>Ką šiandien veiksime?</p><div class="sugg"></div>';
    SUGG.forEach(s => {
      const btn = document.createElement('button');
      btn.textContent = s;
      btn.onclick = () => { $('input').value = s; send(); };
      e.querySelector('.sugg').appendChild(btn);
    });
    $('chat').appendChild(e);
  } else history.forEach(m => add(m.role, m.content));
}
function base() { return (S.get('baseUrl') || '').replace(/\/+$/, ''); }
function grow() { const t = $('input'); t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

async function send() {
  const text = $('input').value.trim();
  if (!text) return;
  if (!base() || !S.get('apiKey')) { openSettings(); return; }
  $('input').value = ''; grow();
  history.push({ role: 'user', content: text });
  add('user', text);
  const el = add('assistant', '');
  el.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  $('send').disabled = true;
  try {
    const r = await fetch(base() + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + S.get('apiKey') },
      body: JSON.stringify({ model: $('model').value, messages: history })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error?.message || ('HTTP ' + r.status));
    const ans = d.choices?.[0]?.message?.content ?? '(tuščias atsakymas)';
    history.push({ role: 'assistant', content: ans });
    el.innerHTML = md(ans);
    S.set('history', JSON.stringify(history));
  } catch (e) {
    history.pop();
    el.textContent = 'Klaida: ' + e.message;
    el.parentElement.classList.add('err');
  }
  $('send').disabled = false;
  $('chat').scrollTop = $('chat').scrollHeight;
}

$('send').onclick = send;
$('input').addEventListener('input', grow);
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); send(); }
});
$('setBtn').onclick = openSettings;
$('close').onclick = () => $('settings').close();
$('model').onchange = () => S.set('lastModel', $('model').value);
$('save').onclick = () => {
  S.set('baseUrl', $('baseUrl').value.trim());
  S.set('apiKey', $('apiKey').value.trim());
  S.set('models', $('models').value.trim());
  fillModels();
  $('settings').close();
};
$('fetchModels').onclick = async () => {
  try {
    const url = $('baseUrl').value.trim().replace(/\/+$/, '');
    const r = await fetch(url + '/models', { headers: { 'Authorization': 'Bearer ' + $('apiKey').value.trim() } });
    const d = await r.json();
    $('models').value = (d.data || []).map(m => m.id).join('\n');
  } catch (e) { alert('Nepavyko gauti modelių: ' + e.message); }
};
$('clear').onclick = () => { history = []; S.set('history', '[]'); render(); $('settings').close(); };

fillModels();
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
